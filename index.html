<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contattaci per richieste, informazioni o supporto.">
  <title>Contact us</title>
  <style>
    :root {
      --background: #f6f7fb;
      --surface: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d1d5db;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --focus: rgba(37, 99, 235, 0.18);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 16px;
      display: grid;
      place-items: center;
      background: var(--background);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    .contact-card {
      width: min(100%, 560px);
      padding: 36px;
      background: var(--surface);
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      letter-spacing: -0.02em;
    }

    .intro { margin: 0 0 28px; color: var(--muted); }
    .form-group { margin-bottom: 18px; }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.95rem;
      font-weight: 600;
    }

    input, textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      background: #fff;
      font: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea { min-height: 140px; resize: vertical; }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--focus);
    }

    button {
      width: 100%;
      padding: 12px 18px;
      border: 0;
      border-radius: 6px;
      background: var(--primary);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: var(--primary-hover); }
    button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

    @media (max-width: 480px) {
      .contact-card { padding: 24px 20px; }
    }
  </style>
</head>
<body>
  <main class="contact-card">
    <h1>Do not contact us</h1>
    <p class="intro">Have a questions? Seek for the answer.</p>

    <form action="#" method="post">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" autocomplete="name" required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>

      <div class="form-group">
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" required>
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" required></textarea>
      </div>

      <button type="submit">Submit</button>
    </form>
  </main>
</body>
</html>
