   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1" />
   <title>🎉 Sorpresa per Te! 🎉</title>
   <style>
     * {
       margin: 0;
       padding: 0;
       box-sizing: border-box;
     }

     body {
       width: 100%;
       height: 100vh;
       display: flex;
       flex-direction: column;
       justify-content: center;
       align-items: center;
       background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
       font-family: 'Arial', sans-serif;
       overflow: hidden;
     }

     .prank-container {
       text-align: center;
       animation: bounce 0.6s ease-in-out infinite;
     }

     .gif-container {
       margin-bottom: 2rem;
       animation: pulse 1.5s ease-in-out infinite;
     }

     .gif-container img {
       max-width: 500px;
       width: 90%;
       height: auto;
       border-radius: 20px;
       box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
     }

     .text-container {
       color: white;
       font-size: 2.5rem;
       font-weight: bold;
       text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
       animation: fadeInOut 2s ease-in-out infinite;
     }

     .subtitle {
       color: rgba(255, 255, 255, 0.9);
       font-size: 1.5rem;
       margin-top: 1rem;
       font-weight: normal;
     }

     .sound-indicator {
       margin-top: 2rem;
       font-size: 1.5rem;
       animation: spin 2s linear infinite;
     }

     @keyframes bounce {
       0%, 100% {
         transform: translateY(0);
       }
       50% {
         transform: translateY(-20px);
       }
     }

     @keyframes pulse {
       0%, 100% {
         transform: scale(1);
       }
       50% {
         transform: scale(1.05);
       }
     }

     @keyframes fadeInOut {
       0%, 100% {
         opacity: 1;
       }
       50% {
         opacity: 0.7;
       }
     }

     @keyframes spin {
       0% {
         transform: rotate(0deg);
       }
       100% {
         transform: rotate(360deg);
       }
     }

     @media (max-width: 600px) {
       .text-container {
         font-size: 1.8rem;
       }

       .subtitle {
         font-size: 1.1rem;
       }

       .gif-container img {
         max-width: 90%;
       }
     }
   </style>
</head>
<body>
  <div class="prank-container">
    <div class="gif-container">
      <img src="https://media.giphy.com/media/l0HlDy9x8FZo0XO1i/giphy.gif" alt="Prank GIF" />
    </div>
    <div class="text-container">
      💨 SCORREGGIA GIGANTE! 💨
    </div>
    <div class="subtitle">
      Scherzo! Hai sentito anche il suono? 😂
    </div>
    <div class="sound-indicator">
      🔊 🎺 🔊
    </div>
  </div>

  <audio id="prank-sound" preload="auto">
    <source src="data:audio/wav;base64,UklGRiYAAABXQVZFZm10IBAAAAABAAEAQB8AAAB9AAACABAAZGF0YQIAAAAAAA==" type="audio/wav">
  </audio>

  <script>
    // Funzione per creare il suono della scorreggia usando Web Audio API
    function playFartSound() {
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      
      // Crea diversi nodi audio per un effetto divertente
      const now = audioContext.currentTime;
      
      // Primo "puff" della scorreggia
      const osc1 = audioContext.createOscillator();
      const gain1 = audioContext.createGain();
      osc1.connect(gain1);
      gain1.connect(audioContext.destination);
      
      osc1.frequency.setValueAtTime(80, now);
      osc1.frequency.exponentialRampToValueAtTime(30, now + 0.4);
      gain1.gain.setValueAtTime(0.3, now);
      gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
      
      osc1.start(now);
      osc1.stop(now + 0.4);
      
      // Secondo "puff" con rumore
      const bufferSize = audioContext.sampleRate * 0.3;
      const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
      const data = buffer.getChannelData(0);
      
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      
      const noise = audioContext.createBufferSource();
      const noiseGain = audioContext.createGain();
      noise.buffer = buffer;
      noise.connect(noiseGain);
      noiseGain.connect(audioContext.destination);
      
      noiseGain.gain.setValueAtTime(0.15, now + 0.35);
      noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.65);
      
      noise.start(now + 0.35);
      
      // Terzo "puff" finale
      const osc3 = audioContext.createOscillator();
      const gain3 = audioContext.createGain();
      osc3.connect(gain3);
      gain3.connect(audioContext.destination);
      
      osc3.frequency.setValueAtTime(50, now + 0.65);
      osc3.frequency.exponentialRampToValueAtTime(20, now + 0.95);
      gain3.gain.setValueAtTime(0.25, now + 0.65);
      gain3.gain.exponentialRampToValueAtTime(0.01, now + 0.95);
      
      osc3.start(now + 0.65);
      osc3.stop(now + 0.95);
    }

    // Riproduci il suono al caricamento della pagina
    window.addEventListener('load', function() {
      setTimeout(function() {
        playFartSound();
      }, 500);
    });

    // Riproduci il suono anche al click
    document.body.addEventListener('click', function() {
      playFartSound();
    });
  </script>

</body>
</html>
